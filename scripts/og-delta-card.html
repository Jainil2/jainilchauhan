<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px;
        background: #fafaf9;
        color: #0c0a09;
        font-family: Manrope, system-ui, sans-serif;
        display: flex; flex-direction: column; justify-content: center;
        padding: 84px 88px;
        position: relative;
        overflow: hidden;
      }
      .rule { position: absolute; left: 0; right: 0; height: 1px; background: #e7e5e4; }
      .rule.top { top: 0; }
      .rule.bottom { bottom: 0; }
      .kicker {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #78716c;
      }
      h1 {
        font-family: Sora, system-ui, sans-serif;
        font-size: 86px; font-weight: 700; line-height: 1.02;
        letter-spacing: -0.03em; margin-top: 26px;
      }
      p.sub {
        font-size: 30px; line-height: 1.42; color: #57534e;
        margin-top: 26px; max-width: 820px;
      }
      .chain {
        display: flex; align-items: center; gap: 18px;
        margin-top: 46px; font-size: 24px;
      }
      .pill {
        border: 1px solid #d6d3d1; border-radius: 999px;
        padding: 11px 22px; background: #fff; color: #0c0a09;
        font-weight: 600;
      }
      .arrow { color: #a8a29e; font-size: 28px; }
      .known { color: #78716c; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="rule top"></div>
    <div class="rule bottom"></div>

    <p class="kicker">Delta</p>
    <h1>You already know<br />most of this.</h1>
    <p class="sub">
      AI systems taught as small deltas from the CS you have already built —
      with challenges you actually run.
    </p>

    <div class="chain">
      <span class="pill">LRU Cache</span>
      <span class="arrow">→</span>
      <span class="pill">KV Cache</span>
      <span class="known">&nbsp;&nbsp;same eviction, GPU memory as the ceiling</span>
    </div>
  </body>
</html>
